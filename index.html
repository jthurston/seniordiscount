<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f4e79;
        color: white;
        padding: 30px 20px 35px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 32px;
    }

    header p {
        margin: 0;
        opacity: 0.9;
    }

    .container {
        max-width: 1100px;
        margin: -20px auto 40px;
        padding: 0 20px;
    }

    .search-panel {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,.1);
        position: relative;
    }

    .search-wrapper {
        position: relative;
    }

    .search-input {
        width: 100%;
        height: 58px;
        border: 2px solid #d8dee5;
        border-radius: 10px;
        padding: 0 20px 0 50px;
        font-size: 18px;
        outline: none;
        transition: .2s;
    }

    .search-input:focus {
        border-color: #1f4e79;
    }

    .search-icon {
        position: absolute;
        left: 17px;
        top: 17px;
        font-size: 22px;
        color: #777;
        z-index: 2;
    }

    .autocomplete {
        position: absolute;
        left: 0;
        right: 0;
        top: 62px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,.12);
        z-index: 20;
        overflow: hidden;
        display: none;
    }

    .autocomplete-item {
        padding: 13px 18px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .autocomplete-item:last-child {
        border-bottom: none;
    }

    .autocomplete-item:hover {
        background: #f1f5f9;
    }

    .autocomplete-name {
        font-weight: 700;
    }

    .autocomplete-info {
        font-size: 13px;
        color: #666;
        margin-top: 3px;
    }

    .controls {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 18px;
        align-items: center;
    }

    .age-control {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .age-control input {
        width: 80px;
        height: 40px;
        border: 1px solid #ccc;
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 16px;
    }

    .eligible {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .categories {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    .category-btn {
        border: 1px solid #ccd4dc;
        background: white;
        border-radius: 20px;
        padding: 9px 16px;
        cursor: pointer;
        font-size: 14px;
        transition: .2s;
    }

    .category-btn:hover {
        background: #eef3f7;
    }

    .category-btn.active {
        background: #1f4e79;
        color: white;
        border-color: #1f4e79;
    }

    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 28px 0 15px;
    }

    .results-header h2 {
        margin: 0;
        font-size: 20px;
    }

    .results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 15px;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.07);
        border-left: 5px solid #1f4e79;
        transition: transform .15s, box-shadow .15s;
    }

    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,.12);
    }

    .card h3 {
        margin: 0 0 8px;
        font-size: 20px;
    }

    .category {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        background: #e8f0f7;
        color: #1f4e79;
        border-radius: 5px;
        padding: 4px 7px;
        margin-bottom: 12px;
    }

    .discount {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 12px;
    }

    .age {
        display: inline-block;
        background: #eef7ed;
        color: #2d6a32;
        border-radius: 20px;
        padding: 5px 10px;
        font-size: 13px;
        font-weight: 600;
    }

    .note {
        margin-top: 10px;
        font-size: 13px;
        color: #777;
    }

    .no-results {
        background: white;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        color: #777;
        grid-column: 1 / -1;
    }

    footer {
        text-align: center;
        color: #777;
        font-size: 12px;
        padding: 20px;
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 26px;
        }

        .container {
            padding: 0 12px;
        }

        .results {
            grid-template-columns: 1fr;
        }

        .controls {
            align-items: flex-start;
            flex-direction: column;
        }
    }
</style>
</head>

const ageInput = document.getElementById("age");

const resultsContainer = document.getElementById("results");
const resultCount = document.getElementById("resultCount");
const autocomplete = document.getElementById("autocomplete");
const categoriesContainer = document.getElementById("categories");


/* -----------------------------
   CATEGORIES
----------------------------- */

const categories = [
    "All",
    ...new Set(discounts.map(item => item.category))
];

categories.forEach(category => {

    const button = document.createElement("button");

    button.className = "category-btn";
    button.textContent = category;

    if (category === "All") {
        button.classList.add("active");
    }

    button.addEventListener("click", () => {

        activeCategory = category;

        document
            .querySelectorAll(".category-btn")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderResults();

    });

    categoriesContainer.appendChild(button);

});

----------------------------- */

searchInput.addEventListener("input", () => {

    showAutocomplete();

    renderResults();

});

----------------------------- */

eligibleInput.addEventListener("change", renderResults);


/* -----------------------------
   AUTOCOMPLETE
----------------------------- */

function showAutocomplete() {

    const query = searchInput.value.trim().toLowerCase();

    autocomplete.innerHTML = "";

    if (!query) {
        autocomplete.style.display = "none";
        return;
    }

    const matches = discounts
        .filter(item =>
            item.name.toLowerCase().includes(query) ||
            item.discount.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query) ||
            (item.subcategory && item.subcategory.toLowerCase().includes(query)) ||
            (item.note && item.note.toLowerCase().includes(query))
        )
        .slice(0, 8);

    if (!matches.length) {
        autocomplete.style.display = "none";
        return;
    }

    matches.forEach(item => {

        const div = document.createElement("div");

        div.className = "autocomplete-item";

        div.innerHTML = `
            <div class="autocomplete-name">${escapeHtml(item.name)}</div>
            <div class="autocomplete-info">
                ${escapeHtml(item.discount)}
                ${item.age != null ? ` • Age ${item.age}+` : (item.aarp ? " • AARP" : "")}
            </div>
        `;

        div.addEventListener("click", () => {

            searchInput.value = item.name;

            autocomplete.style.display = "none";

            renderResults();

        });

        autocomplete.appendChild(div);

    });

    autocomplete.style.display = "block";
}


/* -----------------------------

----------------------------- */

function renderResults() {

    const query = searchInput.value.trim().toLowerCase();

    const age = parseInt(ageInput.value);

    let filtered = discounts.filter(item => {

        const matchesSearch =
            !query ||
            item.name.toLowerCase().includes(query) ||
            item.discount.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query) ||
            (item.subcategory &&
             item.subcategory.toLowerCase().includes(query)) ||
            (item.note &&
             item.note.toLowerCase().includes(query));

        const matchesCategory =
            activeCategory === "All" ||
            item.category === activeCategory;

        let matchesAge = true;

        if (eligibleInput.checked) {

            if (!age || !item.age) {
                matchesAge = false;
            } else {
                matchesAge = age >= item.age;
            }

        }

        return matchesSearch && matchesCategory && matchesAge;

    });


    resultCount.textContent =
        `${filtered.length} Discount${filtered.length === 1 ? "" : "s"} Found`;


    resultsContainer.innerHTML = "";


    if (!filtered.length) {

        resultsContainer.innerHTML = `
            <div class="no-results">
                <h3>No discounts found</h3>
                <p>Try another search or category.</p>
            </div>
        `;

        return;

    }


    filtered.forEach(item => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <span class="category">
                ${escapeHtml(item.category)}
                ${item.subcategory ? " • " + escapeHtml(item.subcategory) : ""}
            </span>

            <h3>${escapeHtml(item.name)}</h3>

            <div class="discount">
                ${escapeHtml(item.discount)}
            </div>

            ${
                item.age != null
                ? `<span class="age">Age ${item.age}+</span>`
                : item.aarp
                    ? `<span class="age">AARP membership</span>`
                    : `<span class="age">Age requirement not listed</span>`
            }

            ${
                item.note
                ? `<div class="note">ℹ️ ${escapeHtml(item.note)}</div>`
                : ""
            }

        `;

        resultsContainer.appendChild(card);

    });

}


/* -----------------------------
   ESCAPE HTML
----------------------------- */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* -----------------------------
   CLOSE AUTOCOMPLETE
----------------------------- */

document.addEventListener("click", event => {

    if (!event.target.closest(".search-wrapper")) {
        autocomplete.style.display = "none";
    }

});


/* -----------------------------
   INITIAL DISPLAY
----------------------------- */

renderResults();

</script>

            .catch(error => console.error("Service worker registration failed:", error));
    });
}
</script>
